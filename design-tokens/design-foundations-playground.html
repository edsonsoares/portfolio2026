<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design Foundations Playground</title>
<script src="typography.config.js"></script>
<script src="generate-css.js"></script>
<script src="color.config.js"></script>
<script src="generate-color-css.js"></script>
<script src="spacing.config.js"></script>
<script src="generate-spacing-css.js"></script>
<script src="radius.config.js"></script>
<script src="generate-radius-css.js"></script>
<script>window.MOTION_MANUAL = true;</script>
<script src="motion.config.js"></script>
<script src="generate-motion-css.js"></script>
<script src="motion.js"></script>
<script src="layout.config.js"></script>
<script src="generate-layout-css.js"></script>
<style id="typographyTokens"></style>
<style id="colorTokens"></style>
<style id="spacingTokens"></style>
<style id="radiusTokens"></style>
<style id="layoutTokens"></style>
<style id="motionTokens"></style>
<link rel="stylesheet" href="templates/case-study.css">
<style>
  /* ---------- Playground chrome (deliberately independent of the tokens) ---------- */
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #1d1d1f;
    background: #ececef;
  }
  button, input, select, textarea { font: inherit; color: inherit; }

  .pg-app { display: grid; grid-template-columns: 380px 1fr; height: 100%; }

  .pg-panel {
    display: flex; flex-direction: column;
    background: #fff; border-right: 1px solid #d9d9de;
    min-height: 0;
  }
  .pg-panel header { padding: 16px 18px 12px; border-bottom: 1px solid #ececef; }
  .pg-panel h1 { font-size: 15px; margin: 0 0 10px; }
  .pg-modeswitch { display: flex; gap: 4px; margin: 0 0 12px; flex-wrap: wrap; }
  .pg-modeswitch button {
    flex: 1; border: 1px solid #d9d9de; background: #f6f6f8; border-radius: 6px;
    padding: 6px 8px; cursor: pointer; font-size: 12px; font-weight: 600; min-width: 70px;
  }
  .pg-modeswitch button[aria-current="true"] { background: #1d1d1f; border-color: #1d1d1f; color: #fff; }
  .pg-stepnav { display: flex; gap: 4px; flex-wrap: wrap; }
  .pg-stepnav button {
    border: 1px solid #d9d9de; background: #f6f6f8; border-radius: 6px;
    padding: 4px 8px; cursor: pointer; font-size: 12px;
  }
  .pg-stepnav button[aria-current="step"] { background: #1d1d1f; border-color: #1d1d1f; color: #fff; }

  .pg-step { flex: 1; overflow-y: auto; padding: 16px 18px 24px; }
  .pg-step h2 { font-size: 14px; margin: 0 0 4px; }
  .pg-hint { color: #6e6e73; margin: 0 0 16px; }
  .pg-hint b { color: #1d1d1f; font-weight: 600; }
  .pg-group { margin: 0 0 18px; }
  .pg-group-title {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
    color: #6e6e73; margin: 0 0 8px; font-weight: 600;
  }

  .pg-row { display: grid; grid-template-columns: 92px 1fr; align-items: center; gap: 10px; margin-bottom: 8px; }
  .pg-row > label { color: #3a3a3c; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pg-control { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .pg-control input[type="range"] { flex: 1; min-width: 0; accent-color: #1d1d1f; }
  .pg-control input[type="number"] { width: 70px; }
  .pg-control input[type="text"] { flex: 1; min-width: 0; }
  .pg-control select { flex: 1; min-width: 0; }
  .pg-control input, .pg-control select {
    border: 1px solid #d9d9de; border-radius: 6px; padding: 4px 6px; background: #fff;
  }
  .pg-note { color: #6e6e73; font-size: 12px; margin: 4px 0 0 102px; }
  .pg-note.ok { color: #1f7a3a; }
  .pg-note.warn { color: #b25000; }

  .pg-panel footer {
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    padding: 12px 18px; border-top: 1px solid #ececef;
  }
  .pg-btn {
    border: 1px solid #d9d9de; background: #fff; border-radius: 6px;
    padding: 6px 10px; cursor: pointer;
  }
  .pg-btn.primary { background: #1d1d1f; border-color: #1d1d1f; color: #fff; }
  .pg-btn:disabled { opacity: 0.4; cursor: default; }
  .pg-spacer { flex: 1; }
  .pg-dirty { font-size: 11px; color: #b25000; }

  .pg-main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .pg-toolbar {
    display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
    padding: 10px 18px; background: #f6f6f8; border-bottom: 1px solid #d9d9de;
  }
  .pg-tabs { display: flex; gap: 2px; background: #e3e3e8; padding: 2px; border-radius: 7px; }
  .pg-tabs button { border: 0; background: transparent; padding: 4px 10px; border-radius: 5px; cursor: pointer; }
  .pg-tabs button[aria-selected="true"] { background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
  [hidden] { display: none !important; }
  .pg-toolbar label { display: flex; gap: 6px; align-items: center; color: #3a3a3c; }
  .pg-toolbar select { border: 1px solid #d9d9de; border-radius: 6px; padding: 3px 6px; background: #fff; }
  .pg-toolbar output { font-variant-numeric: tabular-nums; color: #6e6e73; min-width: 56px; }

  .pg-stage { flex: 1; overflow: auto; padding: 24px; }

  /* ---------- Frames: the shared "Context" preview ---------- */
  .pg-frames-outer { container-type: inline-size; margin: 0 auto; width: 100%; }
  .pg-frames { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .pg-frames.pg-frames-single { grid-template-columns: 1fr; }
  @media (max-width: 900px) {
    .pg-frames { grid-template-columns: 1fr; }
  }
  .pg-frame2 {
    container-type: inline-size;
    border-radius: 10px; overflow: hidden; border: 1px solid #d9d9de;
    background: var(--pv-bg); color: var(--pv-fg);
    --pv-bg: #ffffff; --pv-fg: #16161a; --pv-muted: #5c5c66; --pv-line: #e4e4ea; --pv-soft: #f3f3f6; --pv-accent: #2f5bea;
  }
  .pg-frame2-head {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 8px 14px; font-size: 12px; font-weight: 600; background: #f6f6f8;
  }
  .pg-frame2-body { background: var(--color-bg); color: var(--color-text-primary); }
  .pg-frame2-body .pv-hero .text-body-lg,
  .pg-frame2-body .pv-byline,
  .pg-frame2-body .pv-figure figcaption,
  .pg-frame2-body .pv-footnote,
  .pg-frame2-body .pv-card .text-body-sm { color: var(--color-text-secondary); }
  .pg-frame2-body .text-label { color: var(--color-text-secondary); }
  .pg-frame2-body .pv-eyebrow { color: var(--color-accent-text); }
  .pg-frame2-body .pv-figure-img { background: linear-gradient(135deg, var(--color-surface-raised), var(--color-border-subtle)); }
  .pg-frame2-body .pv-code { background: var(--color-surface-raised); }
  .pg-frame2-body .pv-card { border-color: var(--color-border-subtle); }
  .pg-frame2-body .pv-spec-row,
  .pg-frame2-body .pv-ladder-row,
  .pg-frame2-body .pv-article,
  .pg-frame2-body .pv-footnote { border-color: var(--color-border-subtle); }
  /* No border override for the primary — it stays transparent, and dark-mode
     legibility comes from picking a lighter fill step entirely (see accentFillStep
     in generate-color-css.js), not from an added border. */
  .pg-frame2-body .pv-button { background: var(--color-accent); color: var(--color-text-on-accent); }
  .pg-frame2-body .pv-button.ghost { background: transparent; color: var(--color-text-primary); }
  .pg-frame2-body [contenteditable]:focus { box-shadow: 0 0 0 2px var(--color-focus-ring); }
  .pg-frame2-body .pv-ctx-surface-raised { background: var(--color-surface-raised); padding: 10px 12px; border-radius: var(--radius-media, 8px); }
  .pg-frame2-body .pv-tag { background: var(--color-accent-subtle); color: var(--color-accent-text); }
  .pg-frame2-body .pv-status-success { background: var(--color-green-100); color: var(--color-green-700); }
  .pg-frame2-body .pv-modal { background: var(--color-surface); }
  .pg-frame2-body .pv-input { background: var(--color-surface); color: var(--color-text-primary); border-color: var(--color-border-strong); }

  /* ---------- Preview content — typography, spacing and radius tokens apply here
     directly and unconditionally, regardless of which dimension is being edited. ---------- */
  .pv { padding: clamp(20px, 5cqi, 56px); }
  /* Scenes that lay themselves out with the l-* primitives bring their own margins. */
  .pv.pv-flush { padding: 0; }
  .pv * { margin: 0; }
  [contenteditable] { outline: none; }
  [contenteditable]:focus { box-shadow: 0 0 0 2px var(--pv-accent); border-radius: 2px; }

  .pv-specimen { display: grid; gap: 0; }
  .pv-spec-row {
    display: grid; grid-template-columns: 170px 1fr; gap: 24px;
    padding: 20px 0; border-bottom: 1px solid var(--pv-line); align-items: baseline;
  }
  .pv-spec-row:first-child { padding-top: 0; }
  .pv-spec-row:last-child { border-bottom: 0; }
  .pv-meta { font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--pv-muted); }
  .pv-meta strong { display: block; color: var(--pv-fg); font-weight: 600; }
  @container (max-width: 560px) {
    .pv-spec-row { grid-template-columns: 1fr; gap: 6px; }
  }

  .pv-ladder-row {
    display: grid; grid-template-columns: 170px 1fr; gap: 24px; align-items: baseline;
    padding: 12px 0; border-bottom: 1px solid var(--pv-line);
  }
  .pv-ladder-row:last-child { border-bottom: 0; }
  .pv-ladder-sample { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: var(--font-family-sans); line-height: 1.2; }
  @container (max-width: 560px) {
    .pv-ladder-row { grid-template-columns: 1fr; gap: 4px; }
  }

  .pv-context { display: grid; gap: var(--space-section-gap, clamp(40px, 8cqi, 96px)); }
  .pv-hero { display: grid; gap: var(--space-stack, 20px); }
  .pv-hero .text-display { max-width: 16ch; }
  .pv-hero .text-body-lg { max-width: var(--measure); color: var(--pv-muted); }
  .pv-eyebrow { color: var(--pv-accent); }
  .pv-actions { display: flex; gap: var(--space-inline, 12px); flex-wrap: wrap; margin-top: var(--space-stack-tight, 8px); }
  .pv-button {
    display: inline-block; border-radius: var(--radius-control, 999px);
    background: var(--pv-fg); color: var(--pv-bg);
    /* Sentence-case button text has no descenders, so the line box's reserved descender
       space pushes it visually toward the top — trim to the glyphs themselves where
       supported, and fall back to slightly more top padding than bottom elsewhere. */
    text-box: trim-both cap alphabetic;
    padding: 0.85em 1.25em 0.8em;
    border: 1.5px solid transparent;
  }
  /* currentColor ties the border to whatever the label color already is, so they can
     never drift apart — no separate border-color token to keep in sync. */
  .pv-button.ghost { background: transparent; color: var(--pv-fg); border: 1.5px solid currentColor; }
  .pv-input { border-radius: var(--radius-control, 6px); border: 1px solid var(--pv-line); padding: 8px 12px; font: inherit; background: var(--pv-bg); color: var(--pv-fg); width: 100%; }
  .pv-tag { display: inline-block; padding: 3px 10px; border-radius: var(--radius-pill, 999px); background: var(--pv-soft); }
  .pv-modal { border-radius: var(--radius-surface, 12px); border: 1px solid var(--pv-line); padding: 20px; background: var(--pv-bg); box-shadow: 0 4px 20px rgba(0,0,0,.08); }
  .pv-controls { display: flex; flex-direction: column; gap: var(--space-stack, 16px); align-items: flex-start; }
  .pv-controls .pv-modal, .pv-controls .pv-ctx-surface-raised, .pv-controls .pv-status-success { width: 100%; }

  .pv-article { display: grid; gap: var(--space-paragraph-gap, 1em); max-width: var(--measure); }
  .pv-article > .text-heading-lg { margin-bottom: 0.1em; }
  .pv-article > .text-heading-md { margin-top: var(--space-heading-space-before, 1.2em); }
  .pv-article > .text-heading-sm { margin-top: var(--space-heading-space-before, 0.8em); }
  .pv-byline { color: var(--pv-muted); }
  .pv-figure { display: grid; gap: 10px; margin: 0.8em 0; }
  .pv-figure-img {
    aspect-ratio: 16 / 9; max-width: 100%; border-radius: var(--radius-media, 8px);
    background: linear-gradient(135deg, var(--pv-soft), var(--pv-line));
  }
  .pv-figure figcaption { color: var(--pv-muted); }
  .pv-code { background: var(--pv-soft); padding: 14px 16px; border-radius: var(--radius-media, 8px); overflow-x: auto; white-space: pre; }
  .pv-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: var(--space-stack, 16px); }
  .pv-card { display: grid; gap: var(--space-stack-tight, 8px); padding: var(--space-card-padding, 20px); border: 1px solid var(--pv-line); border-radius: var(--radius-card, 10px); align-content: start; }
  .pv-card .text-body-sm { color: var(--pv-muted); }
  .pv-footnote { color: var(--pv-muted); border-top: 1px solid var(--pv-line); padding-top: 1em; }
  .pv-ctx-surface-raised { background: var(--pv-soft); padding: 10px 12px; border-radius: var(--radius-media, 8px); }
  .pv-status-success { padding: 10px 12px; border-radius: var(--radius-media, 8px); background: var(--pv-soft); }

  dialog { border: 0; border-radius: 12px; padding: 0; width: min(760px, calc(100vw - 32px)); box-shadow: 0 20px 60px rgba(0,0,0,.3); }
  dialog::backdrop { background: rgba(0,0,0,.35); }
  .pg-dialog-head { display: flex; gap: 8px; align-items: center; padding: 12px 16px; border-bottom: 1px solid #ececef; flex-wrap: wrap; }
  .pg-dialog-body { padding: 12px 16px 16px; }
  .pg-dialog-body p { margin: 0 0 8px; color: #6e6e73; }
  .pg-dialog-body code { background: #f3f3f6; padding: 1px 4px; border-radius: 4px; }
  dialog textarea {
    width: 100%; height: 50vh; resize: vertical; border: 1px solid #d9d9de; border-radius: 8px;
    padding: 10px; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  @media (max-width: 900px) {
    .pg-app { grid-template-columns: 1fr; height: auto; }
    .pg-panel { border-right: 0; border-bottom: 1px solid #d9d9de; }
    .pg-step { max-height: 55vh; }
    .pg-stage { padding: 16px; }
  }

  /* ---------- Color step controls (swatches) ---------- */
  .pg-swatchrow { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 14px; }
  .pg-swatch-chip { width: 40px; height: 40px; border-radius: 8px; border: 1px solid rgba(0,0,0,.1); }
  .pg-swatch-label { font-size: 10px; color: #6e6e73; text-align: center; margin-top: 3px; }

  /* ---------- Contrast table (color Inspect) ---------- */
  .pg-contrast-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .pg-contrast-table th, .pg-contrast-table td {
    border: 1px solid #d9d9de; padding: 6px 10px; text-align: left; vertical-align: middle;
  }
  .pg-contrast-table th { background: #f6f6f8; }
  .pg-contrast-table td:first-child { max-width: 220px; }
  .pg-pass { color: #1f7a3a; font-weight: 700; }
  .pg-fail { color: #c0392b; font-weight: 700; }
  .pg-exception { color: #b25000; font-weight: 700; }
  .pg-contrast-wrap { overflow-x: auto; }
  details.pg-note { color: inherit; font-size: 12px; margin: 10px 0 18px; }
  details.pg-note summary { cursor: pointer; color: #3a3a3c; font-weight: 600; margin-bottom: 8px; }

  /* ---------- Annotate overlay (shared mechanism for all four dimensions) ---------- */
  /* Each dim's annotate(root) sets data-annotate="<label>" on the elements it cares
     about; this is the one CSS rule that renders whatever label was set. */
  .pg-annotate-active [data-annotate] {
    position: relative;
    outline: 1px dashed var(--pv-accent);
    outline-offset: 3px;
  }
  .pg-annotate-active [data-annotate]::after {
    content: attr(data-annotate);
    position: absolute; top: 0; left: 0; z-index: 5;
    transform: translate(3px, calc(-100% - 3px));
    font: 10px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--pv-bg); background: var(--pv-accent);
    padding: 1px 5px; border-radius: 3px; pointer-events: none;
    white-space: nowrap;
  }

  /* ---------- Motion dimension ---------- */
  .pg-mtoolbar { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; }
  .pg-mrow { display: grid; grid-template-columns: minmax(150px, 220px) 1fr auto; gap: 16px; align-items: center; padding: 8px 0; }
  .pg-mdemo { height: var(--space-8, 8px); background: var(--pv-soft); border-radius: 999px; overflow: hidden; }
  .pg-mdemo-fill { height: 100%; background: var(--pv-accent); transform: scaleX(1); transform-origin: left; transition: transform var(--d) var(--e); }
  .pg-mdemo.is-reset .pg-mdemo-fill { transform: scaleX(0); transition: none; }
  .pg-mcard { background: var(--pv-soft); border: 1px solid var(--pv-line); border-radius: 6px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; font-size: 12px; }
  .pg-mgroup { display: grid; grid-template-columns: repeat(auto-fit, minmax(72px, 1fr)); gap: 8px; grid-column: 1 / span 1; }
  .pg-mrow > .pg-mgroup, .pg-mrow > .pg-mcard { grid-column: 1 / span 2; }
  /* Reduced motion: demos jump to their end state, like the real .reveal. */
  .motion-reduce .pg-mdemo .pg-mdemo-fill, .motion-reduce .pg-mdemo.is-reset .pg-mdemo-fill { transform: scaleX(1); transition: none; }
  @media (prefers-reduced-motion: reduce) { .pg-mdemo .pg-mdemo-fill, .pg-mdemo.is-reset .pg-mdemo-fill { transform: scaleX(1); transition: none; } }

  /* ---------- Layout dimension ---------- */
  #stageInspect { margin: 0 auto; width: 100%; }
  .pg-lbox {
    background: var(--pv-soft); border: 1px solid var(--pv-line); border-radius: 4px;
    padding: 8px 10px; font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--pv-fg);
  }
  .pg-lgallery { padding: 16px 0; border-top: 1px solid var(--pv-line); }
  .pg-lgallery-head { display: flex; gap: 10px; align-items: baseline; font-weight: 600; }
  .pg-lgallery-head code { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--pv-accent); }
  .pg-lgallery-desc { margin: 4px 0 12px; font-size: 12px; color: var(--pv-muted); max-width: 70ch; }
  .pg-lgallery-demo { min-width: 0; }
  .pg-ruler { position: relative; height: 44px; margin-top: 22px; border: 1px solid var(--pv-line); border-radius: 6px; }
  .pg-ruler-seg {
    position: absolute; top: 0; bottom: 0; box-sizing: border-box; padding: 4px 6px; overflow: hidden;
    border-left: 1px solid var(--pv-line); font-size: 11px; line-height: 1.3; color: var(--pv-muted);
  }
  .pg-ruler-seg:first-child { border-left: 0; }
  .pg-ruler-seg strong { display: block; color: var(--pv-fg); }
  .pg-ruler-seg.pg-ruler-active { background: var(--pv-soft); }
  .pg-ruler-marker { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--pv-accent); transform: translateX(-1px); }
  .pg-ruler-marker span {
    position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); white-space: nowrap;
    font: 10px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; padding: 1px 5px; border-radius: 3px;
    background: var(--pv-accent); color: var(--pv-bg);
  }
  .pg-ruler-marker.pg-ruler-over span { transform: translateX(-100%); }
  .pg-layout-annotated { position: relative; }
  /* The overlay is a .l-center breakout grid: columns in the content track, a sample
     .l-bleed strip across the full span. */
  .pg-layout-overlay {
    position: absolute; inset: 0; z-index: 4; pointer-events: none;
    grid-template-rows: 1fr auto; padding-bottom: 14px; row-gap: 8px;
  }
  .pg-layout-cols {
    grid-row: 1; display: grid; grid-template-columns: repeat(var(--layout-columns), minmax(0, 1fr));
    column-gap: var(--layout-gutter);
    /* The gutters show this tint; each column adds a second one on top. */
    background: rgba(0, 110, 255, 0.16); outline: 1px dashed rgba(0, 110, 255, 0.7); outline-offset: 0;
  }
  .pg-layout-cols > div {
    background: rgba(255, 60, 90, 0.14); border-inline: 1px solid rgba(255, 60, 90, 0.4);
    font: 10px/1 ui-monospace, SFMono-Regular, Menlo, monospace; color: rgba(255, 60, 90, 0.9); padding: 4px 0 0 3px;
  }
  .pg-layout-bleed {
    grid-row: 2; display: flex; align-items: center; padding: 4px var(--layout-margin);
    font: 10px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; color: rgb(140, 80, 0);
    background: repeating-linear-gradient(135deg, rgba(255, 170, 0, 0.35) 0 8px, rgba(255, 170, 0, 0.15) 8px 16px);
    border-block: 1px solid rgba(255, 150, 0, 0.9);
  }
  .pg-layout-readout {
    position: absolute; top: 6px; right: 8px; z-index: 6; pointer-events: none;
    font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; padding: 2px 8px; border-radius: 4px;
    background: var(--pv-accent); color: var(--pv-bg);
  }
</style>
</head>
<body>
<div class="pg-app">
  <aside class="pg-panel">
    <header>
      <h1>Design Foundations Playground</h1>
      <div class="pg-modeswitch" id="modeswitch">
        <button data-dim="typography">Typography</button>
        <button data-dim="color">Color</button>
        <button data-dim="spacing">Spacing</button>
        <button data-dim="radius">Radius</button>
        <button data-dim="layout">Layout</button>
        <button data-dim="motion">Motion</button>
      </div>
      <nav class="pg-stepnav" id="stepnav" aria-label="Steps"></nav>
    </header>
    <section class="pg-step" id="step"></section>
    <footer>
      <button class="pg-btn" id="prev">← Back</button>
      <button class="pg-btn primary" id="next">Next →</button>
      <span class="pg-spacer"></span>
      <span class="pg-dirty" id="dirty" hidden>Edited</span>
      <button class="pg-btn" id="reset">Reset</button>
      <button class="pg-btn" id="export">Export</button>
    </footer>
  </aside>

  <main class="pg-main">
    <div class="pg-toolbar">
      <div class="pg-tabs" role="tablist" id="stageSwitch">
        <button data-stage="context" aria-selected="true">Context</button>
        <button data-stage="inspect">Inspect</button>
      </div>
      <label id="sceneSelectLabel">Scene
        <select id="sceneSelect"></select>
      </label>
      <label id="framesPresetLabel">Frames
        <select id="framesPreset"></select>
      </label>
      <span id="inspectThemeLabel" style="display: flex; gap: 14px;" hidden>
        <label>Brand
          <select id="inspectBrand"></select>
        </label>
        <label>Mode
          <select id="inspectMode"></select>
        </label>
      </span>
      <label>Width
        <input type="range" id="width" min="320" max="1600" step="10">
        <output id="widthOut"></output>
      </label>
      <label><input type="checkbox" id="fit"> Fit</label>
      <label id="annotateLabel"><input type="checkbox" id="annotate"> Annotate</label>
      <label id="reduceMotionLabel" hidden><input type="checkbox" id="reduceMotion"> Simulate reduced motion</label>
    </div>
    <div class="pg-stage" id="stage">
      <div class="pg-frames-outer" id="stageContext">
        <div id="frames"></div>
      </div>
      <div id="stageInspect" hidden></div>
    </div>
  </main>
</div>

<dialog id="exportDialog">
  <div class="pg-dialog-head">
    <div class="pg-tabs" id="exportTabs"></div>
    <span class="pg-spacer"></span>
    <button class="pg-btn primary" id="copy">Copy</button>
    <button class="pg-btn" id="closeExport">Close</button>
  </div>
  <div class="pg-dialog-body">
    <p id="exportHint"></p>
    <textarea id="exportText" readonly spellcheck="false"></textarea>
  </div>
</dialog>

<script src="templates/case-study.markup.js"></script>

<script src="playground/frames.js"></script>
<script src="playground/dim-typography.js"></script>
<script src="playground/dim-color.js"></script>
<script src="playground/dim-spacing.js"></script>
<script src="playground/dim-radius.js"></script>
<script src="playground/dim-layout.js"></script>
<script src="playground/dim-motion.js"></script>
<script>
  PG.boot();
</script>
</body>
